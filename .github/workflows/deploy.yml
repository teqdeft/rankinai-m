name: Deploy WordPress Website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would change without uploading anything'
        type: boolean
        default: false
      seed_state:
        description: 'Run ONCE: mark the live site as already in sync (uploads nothing)'
        type: boolean
        default: false

# One deploy at a time. Two overlapping runs would fight over the same FTP
# connection and corrupt the sync-state file the action keeps on the server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        timeout-minutes: 60
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp                 # host drops FTPS connections
          port: 21
          timeout: 600000
          local-dir: ./                 # the repository root is the WordPress root
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run == true || inputs.seed_state == true }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.claude/**
            **/.vscode/**
            **/CLAUDE.md
            **/*.log

            # --- must never be overwritten on the server ---------------------
            .htaccess
            **/wp-config.php
            **/.env

            # Content that lives on the server, not in git.
            wp-content/uploads/**

            # Local runtime output.
            wp-content/upgrade/**
            wp-content/upgrade-temp-backup/**
            wp-content/cache/**

      # Seed run only: upload the state file the dry run just built, so the
      # server is treated as already in sync and later deploys send only changes.
      - name: Save sync state to server
        if: ${{ inputs.seed_state == true }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
        run: |
          dir="${SERVER_DIR#./}"; dir="${dir#/}"
          curl --fail -sS --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T .ftp-deploy-sync-state.json \
            "ftp://$FTP_SERVER/${dir}.ftp-deploy-sync-state.json"
          echo "Sync state saved. Future deploys upload only changed files."
