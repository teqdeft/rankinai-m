name: Deploy WordPress Website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would change without uploading anything'
        type: boolean
        default: false

# One deploy at a time. Two overlapping runs would fight over the same FTP
# connection and corrupt the sync-state file the action keeps on the server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest

    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The site is already live, so it is never re-uploaded in full (the host
      # drops the connection after a few thousand files). If the server has no
      # sync-state file yet, this run only records the live site as in sync.
      - name: Check server sync state
        id: state
        run: |
          dir="${SERVER_DIR#./}"; dir="${dir#/}"
          echo "url=ftp://$FTP_SERVER/${dir}.ftp-deploy-sync-state.json" >> "$GITHUB_OUTPUT"
          set +e
          curl -sS --fail --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER/${dir}.ftp-deploy-sync-state.json" -o /dev/null
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "seed=false" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 78 ]; then
            echo "No sync state on server yet: recording the live site as in sync (no files uploaded)."
            echo "seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not reach the FTP server (curl exit $code). Check the FTP secrets."
            exit 1
          fi

      - name: Deploy via FTP
        timeout-minutes: 60
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp                 # host drops FTPS connections
          port: 21
          timeout: 600000
          local-dir: ./                 # the repository root is the WordPress root
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run == true || steps.state.outputs.seed == 'true' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.claude/**
            **/.vscode/**
            **/CLAUDE.md
            **/*.log

            # --- must never be overwritten on the server ---------------------
            .htaccess
            **/wp-config.php
            **/.env

            # Content that lives on the server, not in git.
            wp-content/uploads/**

            # Local runtime output.
            wp-content/upgrade/**
            wp-content/upgrade-temp-backup/**
            wp-content/cache/**

      - name: Save sync state to server (first run only)
        if: ${{ steps.state.outputs.seed == 'true' && inputs.dry_run != true }}
        run: |
          curl -sS --fail --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T .ftp-deploy-sync-state.json "${{ steps.state.outputs.url }}"
          echo "Sync state saved. From now on only changed files are uploaded."
